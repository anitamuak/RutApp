<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f8fd">
    <script src="../js/theme.js"></script>
    <title>RutApp | Buscar ruta</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../components/header.css">
    <link rel="stylesheet" href="../components/navbar.css">
    <link rel="stylesheet" href="../css/buscar-ruta.css">
    <script src="../js/global.js" defer></script>
    <script src="../components/header.js" defer></script>
    <script src="../components/navbar.js" defer></script>
    <script src="../js/maps.js" defer></script>
    <script src="../js/route-planner.js" defer></script>
    <script src="../js/buscar-ruta.js" defer></script>
  </head>
  <body>
    <main class="app-page route-page">
      <rutapp-header base="../"></rutapp-header>
      <header class="route-page__heading">
        <h1>Buscar ruta</h1>
        <p>Encuentra una ruta para moverte por Santa Marta.</p>
      </header>

      <form class="route-search" id="route-form" novalidate>
        <div class="route-search__field-group">
          <label class="route-search__label" for="origin-display">Desde</label>
          <div class="route-search__origin-field">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="7"></circle>
              <circle cx="12" cy="12" r="2"></circle>
              <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
            </svg>
            <input id="origin-display" type="text" value="Mi ubicación" readonly aria-describedby="origin-error">
            <span class="route-search__caret" aria-hidden="true">⌄</span>
          </div>
          <div class="route-search__origin-actions">
            <button type="button" class="route-search__minor" id="use-location">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="7"></circle>
                <circle cx="12" cy="12" r="2"></circle>
                <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
              </svg>
              Usar mi ubicación
            </button>
            <button type="button" class="route-search__minor" id="pick-origin">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path>
                <circle cx="12" cy="10" r="2.5"></circle>
              </svg>
              Elegir en el mapa
            </button>
          </div>
          <p class="route-search__error" id="origin-error" aria-live="polite"></p>
        </div>

        <div class="route-search__swap-row">
          <button type="button" class="route-search__swap" id="swap-fields" aria-label="Intercambiar origen y destino" title="Intercambiar origen y destino">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3v15m0-15L5 6m3-3 3 3M16 21V6m0 15 3-3m-3 3-3-3"></path>
            </svg>
          </button>
        </div>

        <div class="route-search__field-group route-search__field-group--destination">
          <label class="route-search__label" for="destination-input">Hasta</label>
          <div class="route-search__destination-field">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path>
              <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
            <input id="destination-input" type="search" placeholder="¿A dónde quieres ir?" autocomplete="off" aria-autocomplete="list" aria-controls="destination-suggestions" aria-describedby="destination-error" required>
            <button type="button" class="route-search__clear" id="clear-destination" aria-label="Borrar destino" hidden>×</button>
          </div>
          <div class="route-search__suggestions" id="destination-suggestions" role="listbox" hidden></div>
          <button type="button" class="route-search__minor route-search__map-destination" id="pick-destination">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path>
              <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
            Elegir destino en el mapa
          </button>
          <p class="route-search__error" id="destination-error" aria-live="polite"></p>
        </div>

        <section class="route-demo-control" aria-labelledby="demo-control-title">
          <label class="route-demo-control__label" for="use-demo-routes">
            <input id="use-demo-routes" type="checkbox">
            <span>
              <strong id="demo-control-title">Probar con datos de demostración</strong>
              <small>Son recorridos sintéticos; no corresponden a buses reales de Santa Marta.</small>
            </span>
          </label>
          <button type="button" class="route-search__minor route-demo-control__sample" id="use-demo-points" hidden>
            Usar puntos de ejemplo
          </button>
        </section>

        <button type="submit" class="route-search__submit" id="search-submit">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 5 5"></path>
          </svg>
          Buscar ruta
        </button>
        <p class="route-search__message" id="route-message" role="status" aria-live="polite"></p>
      </form>

      <section class="route-results" id="route-results" aria-live="polite" aria-labelledby="results-title">
        <div class="route-results__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 5h14l2 5v9a1 1 0 0 1-1 1h-1v1h-2v-1H7v1H5v-1H4a1 1 0 0 1-1-1v-9l2-5Zm0 5h14l-1.3-3H6.3L5 10Zm1.5 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm11 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/>
          </svg>
        </div>
        <h2 id="results-title">¿A dónde quieres ir?</h2>
        <p id="results-description">Selecciona tu origen y destino para encontrar opciones de ruta.</p>
        <p class="route-results__notice" id="demo-notice" role="note" hidden></p>
        <div class="route-results__list" id="results-list"></div>
      </section>
    </main>

    <dialog class="map-dialog" id="map-dialog" aria-labelledby="map-title">
      <div class="map-dialog__header">
        <div>
          <h2 id="map-title">Elegir punto en el mapa</h2>
          <p id="map-hint">Mueve el mapa y pulsa sobre el punto.</p>
        </div>
        <button type="button" class="map-dialog__close" id="close-map" aria-label="Cerrar mapa">×</button>
      </div>
      <div class="map-dialog__canvas" id="selection-map" role="application" aria-label="Mapa interactivo para seleccionar una ubicación"></div>
      <p class="map-dialog__selection" id="map-selection" aria-live="polite">Aún no has seleccionado un punto.</p>
      <div class="map-dialog__actions">
        <button type="button" class="map-dialog__cancel" id="cancel-map">Cancelar</button>
        <button type="button" class="map-dialog__confirm" id="confirm-map" disabled>Confirmar punto</button>
      </div>
    </dialog>

    <rutapp-navbar base="../" active="buscar"></rutapp-navbar>
  </body>
</html>
