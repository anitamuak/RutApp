<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f8fd">
    <script src="../js/theme.js"></script>
    <title>RutApp | Inicio</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../components/header.css">
    <link rel="stylesheet" href="../components/navbar.css">
    <link rel="stylesheet" href="../css/inicio.css">
    <script src="../js/global.js" defer></script>
    <script src="../components/header.js" defer></script>
    <script src="../components/navbar.js" defer></script>
    <script src="../js/inicio.js" defer></script>
  </head>
  <body>
    <main class="app-page home-page">
      <rutapp-header base="../"></rutapp-header>

      <section class="home-hero" aria-labelledby="hero-title">
        <img class="home-hero__image" src="../assets/images/Camellon.jpg" alt="">
        <div class="home-hero__copy">
          <h1 id="hero-title">Descubre<br>Santa Marta</h1>
          <p>Nuevos lugares, las mismas rutas</p>
        </div>
      </section>

      <section class="search-card" id="buscador" aria-labelledby="search-title">
        <h2 class="visually-hidden" id="search-title">Buscar una ruta</h2>
        <div class="search-card__quick">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5h14l2 5v9a1 1 0 0 1-1 1h-1v1h-2v-1H7v1H5v-1H4a1 1 0 0 1-1-1v-9l2-5Zm0 5h14l-1.3-3H6.3L5 10Zm1.5 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm11 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/>
          </svg>
          Buscar ruta
        </div>

        <form class="route-form" id="route-form">
          <div class="route-form__origin-row">
            <label class="route-field route-field--origin">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="7"></circle>
                <circle cx="12" cy="12" r="2"></circle>
                <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
              </svg>
              <span class="visually-hidden">Origen</span>
              <input id="origin" name="origin" type="text" value="Mi ubicación actual" autocomplete="street-address">
              <button class="route-field__locate" id="locate-button" type="button" aria-label="Usar mi ubicación actual" title="Usar mi ubicación actual">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="7"></circle>
                  <circle cx="12" cy="12" r="2"></circle>
                  <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
                </svg>
              </button>
            </label>
            <button class="route-form__swap" id="swap-button" type="button" aria-label="Intercambiar origen y destino" title="Intercambiar origen y destino">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3v15m0-15L5 6m3-3 3 3M16 21V6m0 15 3-3m-3 3-3-3"></path>
              </svg>
            </button>
          </div>

          <label class="route-field route-field--destination">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path>
              <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
            <span class="visually-hidden">Destino</span>
            <input id="destination" name="destination" type="text" placeholder="¿A dónde quieres ir?" autocomplete="street-address" required>
          </label>

          <button class="route-form__submit" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.8"></circle>
              <path d="m16 16 5 5"></path>
            </svg>
            <span>Buscar ruta</span>
          </button>
          <p class="status-message route-form__status" id="route-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="featured" aria-labelledby="featured-title">
        <div class="section-heading">
          <h2 id="featured-title">Lugares turísticos destacados</h2>
          <a href="explorar.html">Ver todos</a>
        </div>
        <p class="featured__intro">Conoce lugares increíbles de Santa Marta.</p>
        <div class="featured__list" id="featured-list" aria-live="polite"></div>
      </section>
    </main>
    <rutapp-navbar base="../" active="inicio"></rutapp-navbar>
  </body>
</html>
