<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f8fd">
    <script src="../js/theme.js"></script>
    <title>RutApp | Explorar lugares</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../components/header.css">
    <link rel="stylesheet" href="../components/navbar.css">
    <link rel="stylesheet" href="../css/explorar.css">
    <script src="../js/global.js" defer></script>
    <script src="../components/header.js" defer></script>
    <script src="../components/navbar.js" defer></script>
    <script src="../js/maps.js" defer></script>
    <script src="../js/explorar.js" defer></script>
  </head>
  <body>
    <main class="app-page explore-page">
      <rutapp-header base="../"></rutapp-header>
      <nav class="category-filters" aria-label="Filtrar lugares por categoría">
        <button class="category-filter is-active" type="button" data-category="todos" aria-pressed="true">Todos</button>
        <button class="category-filter" type="button" data-category="playas" aria-pressed="false">Playas</button>
        <button class="category-filter" type="button" data-category="historia" aria-pressed="false">Historia</button>
        <button class="category-filter" type="button" data-category="naturaleza" aria-pressed="false">Naturaleza</button>
        <button class="category-filter" type="button" data-category="otros" aria-pressed="false">Otros</button>
      </nav>

      <section class="catalog" aria-labelledby="catalog-title">
        <div class="catalog__heading">
          <h1 id="catalog-title">Lugares turísticos</h1>
          <span class="catalog__count" id="results-count" aria-live="polite"></span>
        </div>
        <p class="catalog__subtitle" id="catalog-subtitle">Santa Marta y sus alrededores</p>
        <p class="status-message" id="catalog-status" role="status" aria-live="polite"></p>
        <div class="catalog-view-switch" role="group" aria-label="Tipo de vista">
          <button class="catalog-view-switch__button is-active" type="button" data-catalog-view="list" aria-pressed="true">Lista</button>
          <button class="catalog-view-switch__button" type="button" data-catalog-view="map" aria-pressed="false">Mapa</button>
        </div>
        <section class="catalog-map-panel" id="catalog-map-panel" aria-label="Mapa de lugares turísticos" hidden>
          <p class="catalog-map-panel__status" id="catalog-map-status" role="status" aria-live="polite"></p>
          <div class="catalog-map" id="catalog-map" role="application" aria-label="Mapa interactivo de lugares turísticos"></div>
          <p class="catalog-map-panel__note">Los marcadores aproximados se identifican en la ficha del lugar. Los puntos corresponden al catálogo de RutApp.</p>
        </section>
        <div class="place-grid" id="place-grid"></div>
      </section>
    </main>
    <rutapp-navbar base="../" active="explorar"></rutapp-navbar>
  </body>
</html>
