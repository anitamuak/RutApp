<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f8fd">
    <script src="js/theme.js"></script>
    <title>RutApp | Muévete por Santa Marta</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/bienvenida.css">
  </head>
  <body>
    <main class="welcome-screen">
      <header class="brand">
        <p class="brand__name">RutApp</p>
      </header>

      <section class="welcome" aria-labelledby="welcome-title">
        <img
          class="welcome__logo"
          src="assets/images/logo.png"
          alt="Autobús de RutApp con un pin de ubicación y una ruta"
          width="170"
          height="150"
        >
        <h1 class="welcome__title" id="welcome-title">
          <span class="welcome__eyebrow">Muévete por</span>
          <span class="welcome__city">Santa Marta</span>
        </h1>
      </section>

      <section class="start-panel" aria-label="Comenzar">
        <a class="start-button" href="pages/inicio.html">
          <span>Iniciar</span>
          <span class="start-button__arrow" aria-hidden="true"></span>
        </a>
        <img
          class="start-panel__coast"
          src="assets/images/piedepag2.png"
          alt=""
          aria-hidden="true"
          width="2000"
          height="730"
        >
      </section>
    </main>
  </body>
</html>
